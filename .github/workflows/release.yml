name: release

# Tag v<version> (matching pyproject.toml) to:
#   1. build and push ghcr.io/joseprupi/quantra-mcp:<version> and :latest (linux/amd64)
#   2. publish the sdist + wheel to PyPI via trusted publishing (environment: pypi)
#   3. create a GitHub Release whose body is the CHANGELOG section for <version>
# One-time operator setup is in docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/quantra-mcp

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must equal pyproject version and have a CHANGELOG section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "$tag" != "$proj" ]; then
            echo "tag v$tag does not match pyproject.toml version $proj"; exit 1
          fi
          if ! grep -q "^## $tag " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $tag' section"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  gate:
    runs-on: ubuntu-latest
    needs: version-guard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  image:
    runs-on: ubuntu-latest
    needs: [version-guard, gate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version-guard.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version-guard.outputs.version }}
            org.opencontainers.image.licenses=BSD-3-Clause
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dist:
    runs-on: ubuntu-latest
    needs: [version-guard, gate]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: Smoke the wheel
        run: |
          uvx --from dist/quantra_mcp-*.whl quantra-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    runs-on: ubuntu-latest
    needs: [version-guard, build-dist]
    environment:
      name: pypi
      url: https://pypi.org/project/quantra-mcp/${{ needs.version-guard.outputs.version }}/
    permissions:
      id-token: write   # trusted publishing (OIDC); no API token stored anywhere
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: [version-guard, image, pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: CHANGELOG section -> release body
        env:
          VERSION: ${{ needs.version-guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-body.md
          {
            echo
            echo "Install: \`uvx quantra-mcp\` · Image: \`${IMAGE}:${VERSION}\`"
          } >> release-body.md
          test -s release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          name: quantra-mcp ${{ needs.version-guard.outputs.version }}
          body_path: release-body.md
          files: |
            dist/*
            docker-compose.example.yml
