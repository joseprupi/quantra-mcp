name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ENGINE_IMAGE: ghcr.io/joseprupi/quantra-server:0.7.0

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  live:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start the pinned engine
        run: |
          docker pull "$ENGINE_IMAGE"
          docker run -d --name engine -p 18087:8080 "$ENGINE_IMAGE"
          for i in $(seq 1 90); do
            if curl -sf http://localhost:18087/health >/dev/null; then echo "engine healthy"; exit 0; fi
            sleep 2
          done
          echo "engine did not become healthy"; docker logs engine; exit 1
      - name: Live tests
        env:
          QUANTRA_ENGINE_URL: http://localhost:18087
        run: uv run pytest tests/live -m live -v
      - name: Live check (MCP result == direct replay)
        env:
          QUANTRA_ENGINE_URL: http://localhost:18087
        run: uv run python scripts/live_check.py
      - if: always()
        run: docker rm -f engine || true
