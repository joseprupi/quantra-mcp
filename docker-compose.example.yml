# Self-hosted quantra-mcp + the pinned Quantra engine. Copy, adjust, then:
#   docker compose -f docker-compose.example.yml up -d
#   curl http://localhost:8765/readyz          # engine reachable through the MCP server
#   claude mcp add --transport http quantra http://localhost:8765/mcp
# Only the MCP server is published; the engine stays on the compose network.
services:
  quantra-engine:
    image: ghcr.io/joseprupi/quantra-server:0.7.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s

  mcp:
    image: ghcr.io/joseprupi/quantra-mcp:0.1.4
    restart: unless-stopped
    depends_on:
      quantra-engine:
        condition: service_started
    ports:
      - "8765:8765"
    environment:
      QUANTRA_ENGINE_URL: http://quantra-engine:8080
      # Hosted-mode knobs (defaults shown). Set QUANTRA_TRUST_PROXY=1 and
      # QUANTRA_ALLOWED_HOSTS only when a reverse proxy in front of this
      # container terminates TLS for a public hostname.
      QUANTRA_RATE_LIMIT_RPM: "60"
      QUANTRA_RATE_LIMIT_BURST: "20"
      QUANTRA_MAX_CONCURRENCY: "4"
      QUANTRA_MAX_QUEUE: "8"
      QUANTRA_MAX_BODY_BYTES: "2097152"
      QUANTRA_TRUST_PROXY: "0"
      # QUANTRA_ALLOWED_HOSTS: mcp.example.com,localhost
      # QUANTRA_PUBLIC_URL: https://mcp.example.com
      QUANTRA_REQUIRE_ENGINE: "0"
